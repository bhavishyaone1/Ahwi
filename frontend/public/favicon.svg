<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="aetherGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#aetherGrad)"/>
  <!-- Outer concentric radar arc -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#020617" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="38 15" opacity="0.6"/>
  <!-- Mid isobar / sensor sweep ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#020617" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="24 8" opacity="0.85"/>
  <!-- Central Observation Node / Station Core -->
  <circle cx="16" cy="16" r="2.5" fill="#020617"/>
  <!-- Synoptic Radial Sweep Ray -->
  <line x1="16" y1="16" x2="23" y2="9" stroke="#020617" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
</svg>
